[package]
name = "laputa-hi-lite"
version = "0.3.0"
edition = "2024"
description = "Dependency-free line-oriented syntax highlighting"
license = "MIT"
repository = "https://github.com/laputa-systems/hi-lite"
exclude = ["tools/bump_minor_release.sh"]

# Keep the published package name distinct from the Rust crate name used by
# consumers (`use hi_lite::...`).
[lib]
name = "hi_lite"

[dev-dependencies]
rustybench = "0.1"
# Dev-only: `examples/gen_xsh.rs` parses the XSH registry source with `syn` to
# regenerate the vocabulary region of `src/languages/xsh.rs`.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[[bench]]
name = "hi_lite"
harness = false
