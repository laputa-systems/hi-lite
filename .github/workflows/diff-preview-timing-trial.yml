name: Paired diff preview trial

on: pull_request

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: timing
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: joshuarli/usr
          ref: 326b66eae2b4e3d2d8709200b4e100b0953a6a0d
          path: .work/tools
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Build and measure the same unified diff fixtures
        shell: bash
        run: |
          set -euo pipefail
          proof="$PWD/.work/tmp/diff-timing"
          gate="$PWD/.work/tools/dotfiles/base/.local/bin/perf-gate-ready"
          export CARGO_BUILD_JOBS=2 TMPDIR="$PWD/.work/tmp"
          mkdir -p "$proof/reports"
          git worktree add --detach "$proof/source-before" 5a38860ba797d5d0cdcdf2221f5adf7edeb9b010
          cmp Cargo.lock "$proof/source-before/Cargo.lock"
          sha256sum Cargo.lock
          if grep -E '^source = ' Cargo.lock | grep -Fvx 'source = "registry+https://github.com/rust-lang/crates.io-index"'; then
            exit 1
          fi
          shopt -s nullglob
          for side in before after; do
            source="$PWD"
            if [[ $side == before ]]; then source="$proof/source-before"; fi
            export CARGO_TARGET_DIR="$proof/target-$side"
            mv "$source/.cargo/config.toml" "$proof/registry-$side.toml"
            (cd "$source" && cargo bench --locked --bench hi_lite --no-run)
            mv "$proof/registry-$side.toml" "$source/.cargo/config.toml"
            executables=()
            for file in "$CARGO_TARGET_DIR"/release/deps/hi_lite-* \
              "$CARGO_TARGET_DIR"/release/build/laputa-hi-lite/*/out/hi_lite-*; do
              if [[ -f $file && -x $file ]]; then executables+=("$file"); fi
            done
            test "${#executables[@]}" -eq 1
            cp "${executables[0]}" "$proof/bench-$side"
            git -C "$source" rev-parse HEAD
          done
          shasum -a 256 "$proof/bench-before" "$proof/bench-after"
          wc -c "$proof/bench-before" "$proof/bench-after"
          uname -smr
          rustc --version

          check_quiet() {
            "$gate" -1 > "$proof/reports/readiness.log" 2>&1 &&
              ! grep -Fq 'hot process tree' "$proof/reports/readiness.log"
          }
          wait_quiet() {
            for _ in {1..18}; do
              if check_quiet; then return; fi
              sleep 10
            done
            cat "$proof/reports/readiness.log" >&2
            exit 75
          }
          for pair in 1 2 3 4 5; do
            sides=(before after)
            if (( pair % 2 == 0 )); then sides=(after before); fi
            for side in "${sides[@]}"; do
              wait_quiet
              result="$proof/reports/$pair-$side.json"
              "$proof/bench-$side" --bench 'hi_lite_unified_diff_(warm|cold)$' \
                --format json --sample-count 60 --min-time 0.5 --max-time 1.5 \
                > "$result"
              test -s "$result"
              check_quiet || { cat "$proof/reports/readiness.log" >&2; exit 75; }
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: diff-timing-reports
          path: .work/tmp/diff-timing/reports
